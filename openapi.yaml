openapi: 3.1.0
info:
  title: AfterBell Continuity API
  version: 0.1.0
  description: Policy-bound continuity checks, rescue plans, credentials, and execution passports for tokenized stocks.
servers:
  - url: http://127.0.0.1:4173/api
paths:
  /health:
    get:
      operationId: health
      responses:
        "200":
          description: Service health and evidence mode
  /v1/demo/position:
    get:
      operationId: demoPosition
      responses:
        "200":
          description: Clearly labelled simulated position data
  /v1/demo/check:
    get:
      operationId: demoContinuityCheck
      responses:
        "200":
          description: Deterministic continuity decision
  /v1/demo/judge:
    get:
      operationId: demoJudgeRun
      responses:
        "200":
          description: Reproducible simulated and adversarial Judge Run
  /v1/continuity/check:
    post:
      operationId: checkContinuity
      responses:
        "200":
          description: Continuity decision
        "422":
          description: Missing or unverifiable evidence
  /v1/rescue/plan:
    post:
      operationId: planRescue
      responses:
        "200":
          description: Unsigned rescue plan
  /v1/credentials/issue:
    post:
      operationId: issueCredential
      security:
        - bearerAuth: []
      responses:
        "200":
          description: Short-lived EIP-712 signed credential
  /v1/credentials/verify:
    post:
      operationId: verifyCredential
      responses:
        "200":
          description: Credential validity result
  /v1/passports/{id}:
    get:
      operationId: getPassport
      parameters:
        - in: path
          name: id
          required: true
          schema: { type: string }
      responses:
        "200":
          description: Execution passport
        "404":
          description: Passport not found
  /v1/passports/verify:
    post:
      operationId: verifyPassport
      responses:
        "200":
          description: Independent replay result
  /v1/consumers/admit:
    post:
      operationId: admitConsumer
      summary: Independently decide whether a wallet or vault may automate against a Credential and Passport
      responses:
        "200":
          description: ALLOW_AUTOMATION, REQUIRE_MANUAL_REVIEW, or DENY with deterministic checks
        "422":
          description: Invalid Credential, Passport, signer, or request shape
  /v1/watch/tasks:
    get:
      operationId: listWatchTasks
      responses:
        "200":
          description: Persistent Watchtower tasks
    post:
      operationId: createWatchTask
      security:
        - bearerAuth: []
      responses:
        "201":
          description: Watchtower task created
        "422":
          description: Invalid position or interval
  /v1/watch/tasks/{id}/inspect:
    post:
      operationId: inspectWatchTask
      security:
        - bearerAuth: []
      parameters:
        - in: path
          name: id
          required: true
          schema: { type: string }
      responses:
        "200":
          description: Persisted task and deterministic Watchtower event
        "404":
          description: Task not found
  /v1/agent/watchtower:
    post:
      operationId: invokeWatchtowerAgent
      security:
        - bearerAuth: []
      responses:
        "200":
          description: Local deterministic Agent service response
        "422":
          description: Invalid watched position
components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      description: Required for mutable or signing endpoints when AFTERBELL_API_TOKEN is configured.
