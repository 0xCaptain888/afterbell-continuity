name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - uses: pnpm/action-setup@v4
        with:
          version: 10.24.0
      - run: npm ci
      - run: pnpm --dir bnb-agent install --frozen-lockfile
      - run: npm run check
      - run: npm run build
      - run: npm pack --dry-run --cache .runtime/npm-cache
      - run: npm run contracts:plan
      - run: npm run submission:audit
      - run: npm audit --omit=dev --audit-level=high
